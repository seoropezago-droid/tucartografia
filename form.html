<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Intake - Tu Cartografía</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.0"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cormorant Garamond', serif;
            background-color: #1a1c24;
            color: #d4c5a9;
            line-height: 1.6;
        }
        .container { max-width: 700px; margin: 0 auto; padding: 60px 40px; }
        h1 { font-family: 'JetBrains Mono', monospace; font-size: 20px; color: #c87941; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { font-size: 13px; color: #8a6c5a; margin-bottom: 40px; }
        .form-section { margin-bottom: 40px; padding-bottom: 40px; border-bottom: 1px solid #8a6c5a; }
        .section-title { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #c87941; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        label { display: block; margin-bottom: 15px; font-size: 14px; }
        label strong { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="date"], input[type="time"], textarea, select {
            width: 100%;
            padding: 10px;
            background-color: #252731;
            border: 1px solid #8a6c5a;
            color: #d4c5a9;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            margin-bottom: 5px;
        }
        textarea { resize: vertical; min-height: 80px; }
        .radio-group, .checkbox-group { margin-bottom: 15px; }
        .radio-group label, .checkbox-group label { margin-bottom: 8px; display: flex; align-items: center; }
        input[type="radio"], input[type="checkbox"] { margin-right: 8px; }
        .scale-input { display: flex; gap: 5px; }
        .scale-input label { margin: 0; }
        .scale-input input[type="radio"] { width: auto; }
        .helper-text { font-size: 12px; color: #8a6c5a; margin-top: 3px; }
        .hidden { display: none; }
        .privacy-check { margin: 30px 0; }
        .button-group { margin-top: 40px; text-align: center; }
        button {
            background-color: #c87941;
            color: #1a1c24;
            padding: 15px 50px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover { background-color: #d99650; }
        .error { color: #ff2828; font-size: 12px; margin-top: 5px; }
        .success { color: #2add3c; font-size: 14px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tu Cartografía</h1>
        <p class="subtitle">Formulario de Diagnóstico — Completa en 10-15 minutos</p>

        <form id="intakeForm">
            <!-- Datos de Acceso -->
            <div class="form-section">
                <div class="section-title">Datos de Acceso</div>
                <label>
                    <strong>Correo electrónico *</strong>
                    <input type="email" name="email" required>
                </label>
            </div>

            <!-- Consentimiento -->
            <div class="form-section privacy-check">
                <div class="section-title">Consentimiento</div>
                <label class="checkbox-group">
                    <input type="checkbox" name="consent_18_plus" required>
                    <span>Confirmo que tengo 18 años o más y acepto que mis respuestas sean utilizadas de forma anónima con fines de diagnóstico de Tu Cartografía *</span>
                </label>
            </div>

            <!-- Datos de Nacimiento -->
            <div class="form-section">
                <div class="section-title">Datos de Nacimiento</div>
                <label>
                    <strong>Fecha de nacimiento *</strong>
                    <input type="date" name="birth_date" required>
                    <div class="helper-text">Formato: DD/MM/AAAA</div>
                </label>
                <label>
                    <strong>¿Conoces tu hora de nacimiento? *</strong>
                    <div class="radio-group">
                        <label><input type="radio" name="knows_birth_time" value="yes" required> Sí</label>
                        <label><input type="radio" name="knows_birth_time" value="approximate"> Sí, pero es aproximada</label>
                        <label><input type="radio" name="knows_birth_time" value="no"> No</label>
                    </div>
                </label>
                <label id="birth_time_label" class="hidden">
                    <strong>Hora de nacimiento</strong>
                    <input type="time" name="birth_time">
                    <div class="helper-text">Formato 24h. Ej: 14:30</div>
                </label>
                <label>
                    <strong>Ciudad y país de nacimiento *</strong>
                    <input type="text" name="birth_city_country" placeholder="Ej: Ciudad de México, México" required>
                </label>
            </div>

            <!-- A | Decisiones -->
            <div class="form-section">
                <div class="section-title">A | Decisiones</div>
                <label>
                    <strong>Consultas externas antes de decidir *</strong>
                    <div class="helper-text">En los últimos 2 años, ¿cuántas decisiones importantes tomaste sin consultar a nadie antes de decidir? (Considera decisiones de trabajo, dinero, relaciones o cambios de vida.)</div>
                    <div class="radio-group">
                        <label><input type="radio" name="a1_solo_decisions" value="0" required> 0</label>
                        <label><input type="radio" name="a1_solo_decisions" value="1"> 1</label>
                        <label><input type="radio" name="a1_solo_decisions" value="2"> 2</label>
                        <label><input type="radio" name="a1_solo_decisions" value="3"> 3</label>
                        <label><input type="radio" name="a1_solo_decisions" value="4"> 4</label>
                        <label><input type="radio" name="a1_solo_decisions" value="5"> 5</label>
                        <label><input type="radio" name="a1_solo_decisions" value="5+"> Más de 5</label>
                    </div>
                </label>
                <label>
                    <strong>Reversiones de decisión ya comunicadas *</strong>
                    <div class="helper-text">En los últimos 2 años, ¿cuántas veces revertiste una decisión importante que ya habías comunicado a otros?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="a3_decision_reversals" value="0" required> 0</label>
                        <label><input type="radio" name="a3_decision_reversals" value="1"> 1</label>
                        <label><input type="radio" name="a3_decision_reversals" value="2"> 2</label>
                        <label><input type="radio" name="a3_decision_reversals" value="3"> 3</label>
                        <label><input type="radio" name="a3_decision_reversals" value="3+"> Más de 3</label>
                    </div>
                </label>
                <label>
                    <strong>Tendencia a procrastinar *</strong>
                    <div class="scale-input">
                        <label style="margin: 0;">Casi nunca</label>
                        <div class="scale-input">
                            <label><input type="radio" name="procrastination_rating" value="1" required> 1</label>
                            <label><input type="radio" name="procrastination_rating" value="2"> 2</label>
                            <label><input type="radio" name="procrastination_rating" value="3"> 3</label>
                            <label><input type="radio" name="procrastination_rating" value="4"> 4</label>
                            <label><input type="radio" name="procrastination_rating" value="5"> 5</label>
                            <label><input type="radio" name="procrastination_rating" value="6"> 6</label>
                            <label><input type="radio" name="procrastination_rating" value="7"> 7</label>
                            <label><input type="radio" name="procrastination_rating" value="8"> 8</label>
                            <label><input type="radio" name="procrastination_rating" value="9"> 9</label>
                            <label><input type="radio" name="procrastination_rating" value="10"> 10</label>
                        </div>
                        <label style="margin: 0;">Constantemente</label>
                    </div>
                </label>
            </div>

            <!-- B | Identidades -->
            <div class="form-section">
                <div class="section-title">B | Identidades</div>
                <label>
                    <strong>Decisiones tomadas contra opinión del entorno *</strong>
                    <div class="helper-text">En los últimos 2 años, ¿cuántas veces tomaste una decisión importante a pesar de que las personas cercanas a ti estaban en desacuerdo?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="b1_against_social_opinion" value="0" required> 0</label>
                        <label><input type="radio" name="b1_against_social_opinion" value="1"> 1</label>
                        <label><input type="radio" name="b1_against_social_opinion" value="2"> 2</label>
                        <label><input type="radio" name="b1_against_social_opinion" value="3"> 3</label>
                        <label><input type="radio" name="b1_against_social_opinion" value="3+"> Más de 3</label>
                    </div>
                </label>
                <label>
                    <strong>Coherencia rol público / vida privada *</strong>
                    <div class="helper-text">¿Hay aspectos de tu vida, opiniones o decisiones que mantienes activamente en privado con personas de tu entorno laboral o social (no por seguridad, sino porque prevés desaprobación o conflicto)?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="b2_public_private_coherence" value="open" required> No, soy bastante abierto en todos mis contextos</label>
                        <label><input type="radio" name="b2_public_private_coherence" value="few_topics"> Sí, en uno o dos temas específicos</label>
                        <label><input type="radio" name="b2_public_private_coherence" value="several_topics"> Sí, en varios temas</label>
                        <label><input type="radio" name="b2_public_private_coherence" value="significant_gap"> Sí, hay una diferencia importante entre lo que muestro y lo que pienso o hago</label>
                    </div>
                </label>
            </div>

            <!-- Satisfacción y Coherencia -->
            <div class="form-section">
                <div class="section-title">Satisfacción y Coherencia</div>
                <label>
                    <strong>Satisfacción general con tu vida *</strong>
                    <div class="scale-input">
                        <label style="margin: 0;">Muy baja</label>
                        <div class="scale-input">
                            <label><input type="radio" name="life_satisfaction_rating" value="1" required> 1</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="2"> 2</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="3"> 3</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="4"> 4</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="5"> 5</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="6"> 6</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="7"> 7</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="8"> 8</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="9"> 9</label>
                            <label><input type="radio" name="life_satisfaction_rating" value="10"> 10</label>
                        </div>
                        <label style="margin: 0;">Muy alta</label>
                    </div>
                </label>
            </div>

            <!-- C | Relaciones -->
            <div class="form-section">
                <div class="section-title">C | Relaciones</div>
                <label>
                    <strong>Duración promedio de relaciones significativas *</strong>
                    <div class="helper-text">¿Cuánto tiempo duró, en promedio, tus últimas 3 relaciones de amistad o pareja que consideras significativas?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="c1_relationship_duration" value="less_1yr" required> Menos de 1 año</label>
                        <label><input type="radio" name="c1_relationship_duration" value="1_3yr"> 1–3 años</label>
                        <label><input type="radio" name="c1_relationship_duration" value="3_7yr"> 3–7 años</label>
                        <label><input type="radio" name="c1_relationship_duration" value="more_7yr"> Más de 7 años</label>
                        <label><input type="radio" name="c1_relationship_duration" value="only_1_2"> Solo tengo 1 o 2 relaciones significativas activas</label>
                    </div>
                </label>
                <label>
                    <strong>Conflictos gestionados directamente *</strong>
                    <div class="helper-text">En los últimos 2 años, ¿cuántas veces tuviste un conflicto con alguien cercano y lo resolviste hablando directamente con esa persona (no con un tercero)?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="c3_direct_conflict_resolution" value="0" required> 0</label>
                        <label><input type="radio" name="c3_direct_conflict_resolution" value="1"> 1</label>
                        <label><input type="radio" name="c3_direct_conflict_resolution" value="2"> 2</label>
                        <label><input type="radio" name="c3_direct_conflict_resolution" value="3"> 3</label>
                        <label><input type="radio" name="c3_direct_conflict_resolution" value="3+"> Más de 3</label>
                    </div>
                </label>
            </div>

            <!-- D | Direcciones -->
            <div class="form-section">
                <div class="section-title">D | Direcciones</div>
                <label>
                    <strong>Cambios de trabajo o proyecto *</strong>
                    <div class="helper-text">¿Cuántas veces cambiaste de trabajo, empresa, proyecto principal o actividad productiva en los últimos 24 meses?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="d1_work_changes" value="0" required> 0</label>
                        <label><input type="radio" name="d1_work_changes" value="1"> 1</label>
                        <label><input type="radio" name="d1_work_changes" value="2"> 2</label>
                        <label><input type="radio" name="d1_work_changes" value="3"> 3</label>
                        <label><input type="radio" name="d1_work_changes" value="3+"> Más de 3</label>
                    </div>
                </label>
                <label>
                    <strong>Tareas inconclusas activas *</strong>
                    <div class="helper-text">Ahora mismo, ¿cuántos proyectos o tareas importantes tienes iniciados pero sin terminar?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="d3_unfinished_tasks" value="0" required> 0</label>
                        <label><input type="radio" name="d3_unfinished_tasks" value="1"> 1</label>
                        <label><input type="radio" name="d3_unfinished_tasks" value="2_5"> 2–5</label>
                        <label><input type="radio" name="d3_unfinished_tasks" value="6_10"> 6–10</label>
                        <label><input type="radio" name="d3_unfinished_tasks" value="10+"> Más de 10</label>
                    </div>
                </label>
                <label>
                    <strong>Nivel de productividad personal *</strong>
                    <div class="scale-input">
                        <label style="margin: 0;">Muy baja</label>
                        <div class="scale-input">
                            <label><input type="radio" name="productivity_rating" value="1" required> 1</label>
                            <label><input type="radio" name="productivity_rating" value="2"> 2</label>
                            <label><input type="radio" name="productivity_rating" value="3"> 3</label>
                            <label><input type="radio" name="productivity_rating" value="4"> 4</label>
                            <label><input type="radio" name="productivity_rating" value="5"> 5</label>
                            <label><input type="radio" name="productivity_rating" value="6"> 6</label>
                            <label><input type="radio" name="productivity_rating" value="7"> 7</label>
                            <label><input type="radio" name="productivity_rating" value="8"> 8</label>
                            <label><input type="radio" name="productivity_rating" value="9"> 9</label>
                            <label><input type="radio" name="productivity_rating" value="10"> 10</label>
                        </div>
                        <label style="margin: 0;">Muy alta</label>
                    </div>
                </label>
            </div>

            <!-- E | Quiebres -->
            <div class="form-section">
                <div class="section-title">E | Quiebres</div>
                <label>
                    <strong>Número de crisis vividas *</strong>
                    <div class="helper-text">¿Cuántas situaciones de crisis significativa has vivido en los últimos 5 años? Cuenta solo eventos que interrumpieron tu funcionamiento habitual (trabajo, relaciones, rutina) por al menos 1 mes. Ejemplos: pérdida de trabajo, fin de relación importante, pérdida de familiar cercano, problema de salud grave, crisis económica personal, u otros de impacto equivalente.</div>
                    <div class="radio-group">
                        <label><input type="radio" name="e1_crisis_count" value="0" required> 0</label>
                        <label><input type="radio" name="e1_crisis_count" value="1"> 1</label>
                        <label><input type="radio" name="e1_crisis_count" value="2"> 2</label>
                        <label><input type="radio" name="e1_crisis_count" value="3"> 3</label>
                        <label><input type="radio" name="e1_crisis_count" value="3+"> Más de 3</label>
                    </div>
                </label>
                <label>
                    <strong>Año de la crisis más reciente *</strong>
                    <div class="helper-text">¿En qué año ocurrió esa crisis?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="e2_crisis_year" value="2020" required> 2020</label>
                        <label><input type="radio" name="e2_crisis_year" value="2021"> 2021</label>
                        <label><input type="radio" name="e2_crisis_year" value="2022"> 2022</label>
                        <label><input type="radio" name="e2_crisis_year" value="2023"> 2023</label>
                        <label><input type="radio" name="e2_crisis_year" value="2024"> 2024</label>
                        <label><input type="radio" name="e2_crisis_year" value="2025"> 2025</label>
                        <label><input type="radio" name="e2_crisis_year" value="2026"> 2026</label>
                    </div>
                </label>
                <label>
                    <strong>Tiempo de recuperación funcional *</strong>
                    <div class="helper-text">Pensando en la crisis más reciente que viviste: ¿cuánto tiempo pasó hasta que retomaste tu funcionamiento habitual (trabajo, relaciones, rutina)?</div>
                    <div class="radio-group">
                        <label><input type="radio" name="e2_recovery_time" value="less_1mo" required> Menos de 1 mes</label>
                        <label><input type="radio" name="e2_recovery_time" value="1_3mo"> 1–3 meses</label>
                        <label><input type="radio" name="e2_recovery_time" value="3_6mo"> 3–6 meses</label>
                        <label><input type="radio" name="e2_recovery_time" value="6_12mo"> 6–12 meses</label>
                        <label><input type="radio" name="e2_recovery_time" value="more_1yr"> Más de 1 año</label>
                        <label><input type="radio" name="e2_recovery_time" value="not_yet"> Aún no lo he retomado completamente</label>
                    </div>
                </label>
            </div>

            <!-- Datos de Contacto -->
            <div class="form-section">
                <div class="section-title">Datos de Contacto</div>
                <label>
                    <strong>Nombre y apellido *</strong>
                    <input type="text" name="full_name" required>
                </label>
                <label>
                    <strong>País de residencia actual *</strong>
                    <input type="text" name="country_residence" placeholder="México" required>
                </label>
            </div>

            <!-- Botón Enviar -->
            <div class="button-group">
                <button type="submit">Enviar Formulario</button>
            </div>

            <div id="message"></div>
        </form>
    </div>

    <script>
        // Configurar Supabase
        const SUPABASE_URL = 'https://cdhgenroyocasehvlhnn.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkaGdlbnJveW9jYXNlaHZsaG5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNzI1MzYsImV4cCI6MjA4OTY0ODUzNn0.DsNz17oapkjyYi21jxIK4MjK_kVnhTwOWXujTADPrfY';

        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Mostrar/ocultar campo hora de nacimiento
        document.querySelectorAll('input[name="knows_birth_time"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const label = document.getElementById('birth_time_label');
                if (this.value === 'yes' || this.value === 'approximate') {
                    label.classList.remove('hidden');
                    label.querySelector('input').required = true;
                } else {
                    label.classList.add('hidden');
                    label.querySelector('input').required = false;
                    label.querySelector('input').value = '';
                }
            });
        });

        // Enviar formulario a Supabase
        document.getElementById('intakeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const fullName = (formData.get('full_name') || '').trim();
            const nameParts = fullName.split(' ');
            const firstName = nameParts[0] || '';
            const lastName = nameParts.slice(1).join(' ') || '';

            const birthCityCountry = (formData.get('birth_city_country') || '').trim();
            const cityCountryParts = birthCityCountry.split(',');
            const birthCity = cityCountryParts[0]?.trim() || birthCityCountry;
            const birthCountry = cityCountryParts[1]?.trim() || null;

            const data = {
                email: formData.get('email'),
                consent_18_plus: formData.get('consent_18_plus') === 'on',
                birth_date: formData.get('birth_date'),
                birth_precision: formData.get('knows_birth_time'),
                birth_time: formData.get('birth_time') || null,
                birth_city: birthCity,
                birth_country: birthCountry,
                first_name: firstName,
                last_name: lastName,
                country_residence: formData.get('country_residence'),
                acquisition_source: 'MX',
                form_responses: {
                    a1_solo_decisions: formData.get('a1_solo_decisions'),
                    a3_decision_reversals: formData.get('a3_decision_reversals'),
                    procrastination_rating: parseInt(formData.get('procrastination_rating')),
                    b1_against_social_opinion: formData.get('b1_against_social_opinion'),
                    b2_public_private_coherence: formData.get('b2_public_private_coherence'),
                    life_satisfaction_rating: parseInt(formData.get('life_satisfaction_rating')),
                    c1_relationship_duration: formData.get('c1_relationship_duration'),
                    c3_direct_conflict_resolution: formData.get('c3_direct_conflict_resolution'),
                    d1_work_changes: formData.get('d1_work_changes'),
                    d3_unfinished_tasks: formData.get('d3_unfinished_tasks'),
                    productivity_rating: parseInt(formData.get('productivity_rating')),
                    e1_crisis_count: formData.get('e1_crisis_count'),
                    e2_crisis_year: formData.get('e2_crisis_year'),
                    e2_recovery_time: formData.get('e2_recovery_time')
                }
            };

            const messageDiv = document.getElementById('message');
            try {
                const { data: result, error } = await supabaseClient
                    .from('intake_submissions')
                    .insert([data]);

                if (error) throw error;

                messageDiv.innerHTML = '<div class="success">✓ Formulario recibido. Recibirás tu informe en 24-48 horas.</div>';
                this.reset();
            } catch (error) {
                console.error('Error:', error);
                messageDiv.innerHTML = '<div class="error">Error al enviar: ' + error.message + '</div>';
            }
        });
    </script>
</body>
</html>
